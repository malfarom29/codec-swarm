# M3 comparison: 10 comparable tickets for malfarom29/codec-swarm-sandbox.
# Each is one function in src/sandbox/, a few clear acceptance criteria, no dependency on another ticket.
- title: Reject negative and over-precise amounts in to_cents
  description: |
    to_cents("-1.50") returns -50 instead of failing.
    - to_cents raises ValueError("amount cannot be negative") for any negative amount.
    - to_cents raises ValueError("amount has more than two decimals") for amounts like "1.234".
    - Valid amounts keep their current results.
- title: Add from_cents to format cents as a decimal string
  description: |
    Add from_cents(cents: int) -> str in src/sandbox.
    - from_cents(1234) == "12.34", from_cents(5) == "0.05", from_cents(0) == "0.00".
    - Negative values keep the sign: from_cents(-50) == "-0.50".
    - to_cents(from_cents(x)) == x for any non-negative int x.
- title: Add format_money with currency symbols and thousands separators
  description: |
    Add format_money(cents: int, currency: str = "USD") -> str.
    - format_money(123456) == "$1,234.56"; format_money(123456, "EUR") == "€1,234.56"; "GBP" uses "£".
    - Negative amounts put the sign first: format_money(-500) == "-$5.00".
    - An unknown currency raises ValueError naming the currency.
- title: Add parse_money to read formatted amounts back into cents
  description: |
    Add parse_money(text: str) -> int.
    - parse_money("$1,234.56") == 123456; parse_money("€0.99") == 99; parse_money("12") == 1200.
    - Surrounding whitespace is ignored.
    - Anything that is not a valid amount raises ValueError with the original text in the message.
- title: Add split_cents to divide an amount into equal parts
  description: |
    Add split_cents(cents: int, parts: int) -> list[int].
    - The parts always sum to the original amount: split_cents(100, 3) == [34, 33, 33].
    - Larger parts come first; split_cents(0, 4) == [0, 0, 0, 0].
    - parts < 1 or a negative amount raises ValueError.
- title: Add apply_discount with half-up rounding to the cent
  description: |
    Add apply_discount(cents: int, percent: str) -> int, where percent is a decimal string like "12.5".
    - apply_discount(1000, "10") == 900; apply_discount(999, "12.5") == 874 (874.125 rounds half up to 874).
    - apply_discount(1, "50") == 1 (0.5 rounds half up).
    - percent outside 0..100 raises ValueError.
- title: Add a Money value type that only adds amounts in the same currency
  description: |
    Add an immutable Money(cents: int, currency: str) dataclass.
    - Money(100, "USD") + Money(250, "USD") == Money(350, "USD"); subtraction works the same way.
    - Adding or subtracting different currencies raises ValueError naming both currencies.
    - Money is hashable and two equal amounts compare equal.
- title: Add compute_tax with banker's rounding from basis points
  description: |
    Add compute_tax(cents: int, rate_bp: int) -> int, where 825 basis points = 8.25%.
    - compute_tax(10000, 825) == 825.
    - Half cents round to even: compute_tax(50, 1000) == 5, compute_tax(25, 1000) == 2 (2.5 rounds to 2), compute_tax(35, 1000) == 4 (3.5 rounds to 4).
    - A negative amount or rate raises ValueError.
- title: Add convert to change currency with an exchange rate
  description: |
    Add convert(cents: int, rate: str) -> int, where rate is a decimal string like "0.9183".
    - convert(10000, "0.9183") == 9183; convert(1, "0.5") == 1 (half up).
    - The rate is parsed as a Decimal, never a float.
    - A rate that is zero, negative or not a number raises ValueError.
- title: Add sum_amounts to total a list of amount strings
  description: |
    Add sum_amounts(amounts: list[str]) -> int using to_cents.
    - sum_amounts(["1.50", "2.25"]) == 375; blank strings are skipped; an empty list totals 0.
    - An invalid entry raises ValueError whose message includes its position, e.g. "amount 2 is invalid".
    - The result equals the sum of to_cents for each valid entry.
