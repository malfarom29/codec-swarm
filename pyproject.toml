[project]
name = "codec-swarm"
version = "0.1.0"
description = "Local orchestrator that runs a swarm of Claude Code agents from a Jira ticket to a reviewed PR"
readme = "README.md"
authors = [
    { name = "Manuel Alfaro", email = "malfaro.m29@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
codec-swarm = "codec_swarm.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls Claude Code or Jev for real (opt-in: -m live)"]
